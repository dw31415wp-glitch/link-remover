<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Link Remover</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.9/babel.min.js"></script>
  <style>
    :root {
      color-scheme: light;
      --bg: #f6f7f3;
      --surface: #ffffff;
      --surface-soft: #eef4ef;
      --text: #1f2520;
      --muted: #5f685f;
      --border: #cbd6cc;
      --accent: #176b5b;
      --accent-strong: #0f4c40;
      --accent-soft: #dcebe6;
      --warn: #856317;
      --warn-bg: #fff6d8;
      --error: #a13c3c;
      --error-bg: #fff0ee;
      --focus: #2b79c2;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-width: 320px;
      color: var(--text);
      background:
        linear-gradient(180deg, rgba(23, 107, 91, 0.08), transparent 220px),
        var(--bg);
    }

    button,
    input,
    select,
    textarea {
      font: inherit;
    }

    .app-shell {
      width: min(1120px, calc(100% - 32px));
      margin: 0 auto;
      padding: 32px 0;
    }

    .masthead {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 24px;
    }

    h1,
    h2,
    h3,
    p {
      margin: 0;
    }

    h1 {
      font-size: 2rem;
      line-height: 1.1;
      font-weight: 750;
      letter-spacing: 0;
    }

    h2 {
      font-size: 1.1rem;
      line-height: 1.25;
      letter-spacing: 0;
    }

    h3 {
      font-size: 0.95rem;
      line-height: 1.25;
      letter-spacing: 0;
    }

    .site-pill {
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 8px 12px;
      background: var(--surface);
      color: var(--muted);
      white-space: nowrap;
    }

    .workspace {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(320px, 420px);
      gap: 16px;
      align-items: start;
    }

    .panel {
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--surface);
      box-shadow: 0 1px 2px rgba(31, 37, 32, 0.06);
    }

    .panel-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 16px 18px;
      border-bottom: 1px solid var(--border);
    }

    .form-grid {
      display: grid;
      gap: 16px;
      padding: 18px;
    }

    .top-grid {
      display: grid;
      grid-template-columns: 160px minmax(0, 1fr);
      gap: 14px;
    }

    .field {
      display: grid;
      gap: 7px;
      min-width: 0;
    }

    label {
      font-size: 0.9rem;
      font-weight: 700;
      color: var(--text);
    }

    .info-hint {
      justify-self: start;
      color: var(--accent);
      cursor: help;
      font-size: 0.85rem;
      text-decoration: underline dotted;
      text-underline-offset: 2px;
    }

    input,
    select,
    textarea {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: #fff;
      color: var(--text);
      padding: 10px 12px;
      outline: none;
    }

    textarea {
      min-height: 130px;
      resize: vertical;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      line-height: 1.45;
    }

    input:focus,
    select:focus,
    textarea:focus,
    button:focus-visible {
      border-color: var(--focus);
      box-shadow: 0 0 0 3px rgba(43, 121, 194, 0.18);
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
    }

    button {
      min-height: 42px;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 9px 14px;
      background: #fff;
      color: var(--text);
      font-weight: 700;
      cursor: pointer;
    }

    button.primary {
      border-color: var(--accent);
      background: var(--accent);
      color: #fff;
    }

    button.primary:hover:not(:disabled) {
      background: var(--accent-strong);
    }

    button.secondary:hover:not(:disabled) {
      border-color: var(--accent);
      background: var(--accent-soft);
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.55;
    }

    .status {
      margin: 0 18px 18px;
      border-radius: 8px;
      border: 1px solid var(--border);
      padding: 12px 14px;
      background: var(--surface-soft);
      color: var(--text);
      line-height: 1.4;
    }

    .status.error {
      border-color: #e1b1a9;
      background: var(--error-bg);
      color: var(--error);
    }

    .status.warning {
      border-color: #ead17c;
      background: var(--warn-bg);
      color: var(--warn);
    }

    .status.success {
      border-color: #9ac5b8;
      background: var(--accent-soft);
      color: var(--accent-strong);
    }

    .review {
      display: grid;
      gap: 14px;
      padding: 18px;
    }

    .empty-review {
      color: var(--muted);
      line-height: 1.5;
    }

    .metrics {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
    }

    .metric {
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px;
      background: var(--surface-soft);
      min-width: 0;
    }

    .metric span {
      display: block;
      color: var(--muted);
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
    }

    .metric strong {
      display: block;
      margin-top: 4px;
      overflow-wrap: anywhere;
    }

    pre {
      margin: 0;
      min-height: 76px;
      max-height: 240px;
      overflow: auto;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px;
      background: #f9faf7;
      color: var(--text);
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      line-height: 1.45;
    }

    .review-block {
      display: grid;
      gap: 8px;
    }

    .handoff-note {
      border-left: 4px solid var(--accent);
      padding: 10px 12px;
      background: var(--accent-soft);
      line-height: 1.45;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    @media (max-width: 820px) {
      .app-shell {
        width: min(100% - 20px, 720px);
        padding: 20px 0;
      }

      .masthead,
      .workspace,
      .top-grid {
        grid-template-columns: 1fr;
      }

      .masthead {
        display: grid;
        align-items: start;
      }

      .site-pill {
        justify-self: start;
      }

      .metrics {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useMemo, useState } = React;

    const SITES = {
      en: {
        code: "en",
        label: "English Wikipedia",
        host: "en.wikipedia.org",
      },
      test: {
        code: "test",
        label: "Test Wikipedia",
        host: "test.wikipedia.org",
      },
    };

    const SAMPLE = {
      siteCode: "en",
      pageTitle: "Pamela Liversidge",
      findWikitext: "[https://archive.today/20130118233601/http://www.burkespeerage.com/FamilyHomepage.aspx?FID=8529 Burke's Peerage and Gentry]",
      replaceWikitext: "{{Link removed|Burke's Peerage and Gentry|linkhostpath=archive.today/20130118233601/http://www.burkespeerage.com/FamilyHomepage.aspx?FID=8529|protocol=https}}",
    };

    const STATUS = {
      idle: "idle",
      validating: "validating",
      loading: "loading",
      validationError: "validation_error",
      retrievalError: "retrieval_error",
      noMatch: "no_match",
      ready: "ready_for_review",
      handedOff: "handed_off",
      autoGenerated: "auto_generated",
      unsupportedFind: "unsupported_find",
    };

    function parsePageTitle(input) {
      const value = input.trim();

      if (!value) {
        return "";
      }

      try {
        const url = new URL(value);
        if (url.pathname.startsWith("/wiki/")) {
          return decodeURIComponent(url.pathname.slice("/wiki/".length)).replaceAll("_", " ").trim();
        }

        const title = url.searchParams.get("title");
        if (title) {
          return title.replaceAll("_", " ").trim();
        }
      } catch (error) {
        // Plain page titles are expected here.
      }

      return value.replaceAll("_", " ").trim();
    }

    function getSite(siteCode) {
      return SITES[siteCode] || SITES.en;
    }

    function parseExternalLinkWikitext(value) {
      const trimmed = value.trim();

      if (!trimmed.startsWith("[") || !trimmed.endsWith("]")) {
        return null;
      }

      const inner = trimmed.slice(1, -1);
      const firstWhitespace = inner.search(/\s/);

      if (firstWhitespace < 0) {
        return null;
      }

      const rawUrl = inner.slice(0, firstWhitespace);
      const label = inner.slice(firstWhitespace).trim();

      if (!rawUrl || !label || /\]\s*\[(?:https?:)?\/\//i.test(label)) {
        return null;
      }

      try {
        const url = new URL(rawUrl.startsWith("//") ? `https:${rawUrl}` : rawUrl);
        const protocol = rawUrl.startsWith("//") ? "https" : url.protocol.replace(/:$/, "") || "https";
        const linkhostpath = `${url.host}${url.pathname}${url.search}${url.hash}`;

        if (!/^https?$/.test(protocol) || !url.host || !linkhostpath) {
          return null;
        }

        return {
          protocol,
          linkhostpath,
          label,
        };
      } catch (error) {
        return null;
      }
    }

    function generateLinkRemovedTemplate(findValue) {
      const parsed = parseExternalLinkWikitext(findValue);

      if (!parsed) {
        return "";
      }

      return `{{Link removed|${parsed.label}|linkhostpath=${parsed.linkhostpath}|protocol=${parsed.protocol}}}`;
    }

    function readQueryParameter(search, name) {
      const query = search.startsWith("?") ? search.slice(1) : search;

      for (const part of query.split("&")) {
        if (!part) {
          continue;
        }

        const [rawKey, ...rawValueParts] = part.split("=");

        try {
          const key = decodeURIComponent(rawKey.replaceAll("+", " "));

          if (key === name) {
            return decodeURIComponent(rawValueParts.join("=").replaceAll("+", " "));
          }
        } catch (error) {
          return null;
        }
      }

      return null;
    }

    function getInitialFormState() {
      const state = {
        siteCode: "en",
        pageTitle: "",
        findWikitext: "",
        replaceWikitext: "",
        lastGeneratedReplacement: "",
        status: STATUS.idle,
        message: "Ready",
      };

      if (typeof window === "undefined") {
        return state;
      }

      const nextSiteCode = readQueryParameter(window.location.search, "site");
      const nextPageTitle = readQueryParameter(window.location.search, "page");
      const nextFindWikitext = readQueryParameter(window.location.search, "find");

      if (nextSiteCode && SITES[nextSiteCode]) {
        state.siteCode = nextSiteCode;
      }

      if (nextPageTitle !== null && nextPageTitle.trim()) {
        state.pageTitle = nextPageTitle.replaceAll("_", " ");
      }

      if (nextFindWikitext !== null && nextFindWikitext.trim()) {
        const generatedReplacement = generateLinkRemovedTemplate(nextFindWikitext);
        state.findWikitext = nextFindWikitext;

        if (generatedReplacement) {
          state.replaceWikitext = generatedReplacement;
          state.lastGeneratedReplacement = generatedReplacement;
          state.status = STATUS.autoGenerated;
          state.message = "Replacement generated from URL find parameter.";
        } else {
          state.status = STATUS.unsupportedFind;
          state.message = "Find wikitext was prefilled, but no Link removed replacement could be generated.";
        }
      }

      return state;
    }

    function getApiUrl(site, pageTitle) {
      const params = new URLSearchParams({
        action: "query",
        prop: "revisions",
        titles: pageTitle,
        rvprop: "content",
        rvslots: "main",
        format: "json",
        formatversion: "2",
        origin: "*",
      });

      return `https://${site.host}/w/api.php?${params.toString()}`;
    }

    function extractWikitext(data) {
      const page = data?.query?.pages?.[0];

      if (!page || page.missing || page.invalid) {
        throw new Error("Page source was not found.");
      }

      const revision = page.revisions?.[0];
      const slot = revision?.slots?.main;
      const content = slot?.content ?? slot?.["*"] ?? revision?.content ?? revision?.["*"];

      if (typeof content !== "string") {
        throw new Error("Page source was not available.");
      }

      return content;
    }

    function buildMatchResult(pageText, findWikitext, replaceWikitext) {
      const parts = pageText.split(findWikitext);
      const count = parts.length - 1;

      return {
        count,
        originalSnippet: findWikitext,
        replacementSnippet: replaceWikitext,
        updatedContent: count > 0 ? parts.join(replaceWikitext) : pageText,
      };
    }

    function statusClass(status) {
      if (status === STATUS.validationError || status === STATUS.retrievalError) {
        return "status error";
      }

      if (status === STATUS.noMatch || status === STATUS.handedOff || status === STATUS.unsupportedFind) {
        return "status warning";
      }

      if (status === STATUS.ready || status === STATUS.autoGenerated) {
        return "status success";
      }

      return "status";
    }

    function App() {
      const [initialFormState] = useState(getInitialFormState);
      const [siteCode, setSiteCode] = useState(initialFormState.siteCode);
      const [pageTitle, setPageTitle] = useState(initialFormState.pageTitle);
      const [findWikitext, setFindWikitext] = useState(initialFormState.findWikitext);
      const [replaceWikitext, setReplaceWikitext] = useState(initialFormState.replaceWikitext);
      const [lastGeneratedReplacement, setLastGeneratedReplacement] = useState(initialFormState.lastGeneratedReplacement);
      const [retrievedPageTitle, setRetrievedPageTitle] = useState("");
      const [retrievedWikitext, setRetrievedWikitext] = useState("");
      const [matchResult, setMatchResult] = useState(null);
      const [status, setStatus] = useState(initialFormState.status);
      const [message, setMessage] = useState(initialFormState.message);

      const selectedSite = getSite(siteCode);
      const canHandOff = status === STATUS.ready && matchResult?.count > 0;

      const normalizedPageTitle = useMemo(() => parsePageTitle(pageTitle), [pageTitle]);

      function clearPreparedState(nextStatus = STATUS.idle, nextMessage = "Ready") {
        setRetrievedPageTitle("");
        setRetrievedWikitext("");
        setMatchResult(null);
        setStatus(nextStatus);
        setMessage(nextMessage);
      }

      function handleInputChange(setter) {
        return (event) => {
          setter(event.target.value);
          clearPreparedState();
        };
      }

      function loadSample() {
        setSiteCode(SAMPLE.siteCode);
        setPageTitle(SAMPLE.pageTitle);
        setFindWikitext(SAMPLE.findWikitext);
        setReplaceWikitext(SAMPLE.replaceWikitext);
        setLastGeneratedReplacement(SAMPLE.replaceWikitext);
        clearPreparedState(STATUS.idle, "Sample loaded");
      }

      function handleFindBlur() {
        const generatedReplacement = generateLinkRemovedTemplate(findWikitext);

        if (!findWikitext.trim()) {
          return;
        }

        if (!generatedReplacement) {
          clearPreparedState(STATUS.unsupportedFind, "Find wikitext is not a single supported bracketed external link.");
          return;
        }

        if (replaceWikitext === "" || replaceWikitext === lastGeneratedReplacement) {
          setReplaceWikitext(generatedReplacement);
          setLastGeneratedReplacement(generatedReplacement);
          clearPreparedState(STATUS.autoGenerated, "Replacement generated from find wikitext.");
          return;
        }

        clearPreparedState(STATUS.autoGenerated, "Replacement text was edited manually and was not overwritten.");
      }

      async function handlePreview(event) {
        event.preventDefault();
        setStatus(STATUS.validating);

        if (!SITES[siteCode]) {
          setStatus(STATUS.validationError);
          setMessage("Select a supported Wikipedia site.");
          setMatchResult(null);
          return;
        }

        if (!normalizedPageTitle) {
          setStatus(STATUS.validationError);
          setMessage("Page is required.");
          setMatchResult(null);
          return;
        }

        if (!findWikitext.trim()) {
          setStatus(STATUS.validationError);
          setMessage("Find wikitext is required.");
          setMatchResult(null);
          return;
        }

        const removalNote = replaceWikitext === "" ? " Empty replacement will remove matched wikitext." : "";

        setStatus(STATUS.loading);
        setMessage(`Retrieving ${selectedSite.label} source for ${normalizedPageTitle}...`);
        setMatchResult(null);

        try {
          const response = await fetch(getApiUrl(selectedSite, normalizedPageTitle));

          if (!response.ok) {
            throw new Error(`Wikipedia returned ${response.status}.`);
          }

          const data = await response.json();
          const pageText = extractWikitext(data);
          const nextMatchResult = buildMatchResult(pageText, findWikitext, replaceWikitext);

          setRetrievedPageTitle(normalizedPageTitle);
          setRetrievedWikitext(pageText);
          setMatchResult(nextMatchResult);

          if (nextMatchResult.count === 0) {
            setStatus(STATUS.noMatch);
            setMessage("No exact match found. No edit can be prepared.");
            return;
          }

          setStatus(STATUS.ready);
          setMessage(`${nextMatchResult.count} exact match${nextMatchResult.count === 1 ? "" : "es"} ready for review.${removalNote}`);
        } catch (error) {
          setStatus(STATUS.retrievalError);
          setMessage(error.message || "Page source could not be retrieved.");
          setMatchResult(null);
        }
      }

      function handleHandoff() {
        if (!canHandOff || !matchResult) {
          return;
        }

        const form = document.createElement("form");
        form.method = "POST";
        form.target = "_blank";
        form.action = `https://${selectedSite.host}/w/index.php?title=${encodeURIComponent(retrievedPageTitle)}&action=submit`;
        form.style.display = "none";

        const fields = {
          wpTextbox1: matchResult.updatedContent,
          wpSummary: "Prepare wikitext replacement using Link Remover; review before saving.",
          wpDiff: "Show changes",
          wpUltimateParam: "1",
          wpEditToken: "+\\",
        };

        Object.entries(fields).forEach(([name, value]) => {
          const input = document.createElement("input");
          input.type = "hidden";
          input.name = name;
          input.value = value;
          form.appendChild(input);
        });

        document.body.appendChild(form);
        form.submit();
        form.remove();

        setStatus(STATUS.handedOff);
        setMessage("Opened Wikipedia review. Wikipedia handles login state, diff review, edit conflicts, and final saving.");
      }

      return (
        <main className="app-shell">
          <header className="masthead">
            <div>
              <h1>Link Remover</h1>
            </div>
            <div className="site-pill" aria-label={`Selected site: ${selectedSite.label}`}>
              {selectedSite.label}
            </div>
          </header>

          <div className="workspace">
            <section className="panel" aria-labelledby="replacement-form-title">
              <div className="panel-header">
                <h2 id="replacement-form-title">Replacement</h2>
                <button className="secondary" type="button" onClick={loadSample}>
                  Load sample
                </button>
              </div>

              <form className="form-grid" onSubmit={handlePreview}>
                <div className="top-grid">
                  <div className="field">
                    <label htmlFor="siteCode">Wikipedia site</label>
                    <select
                      id="siteCode"
                      value={siteCode}
                      onChange={handleInputChange(setSiteCode)}
                    >
                      <option value="en">en</option>
                      <option value="test">test</option>
                    </select>
                  </div>

                  <div className="field">
                    <label htmlFor="pageTitle">Page</label>
                    <input
                      id="pageTitle"
                      type="text"
                      value={pageTitle}
                      onChange={handleInputChange(setPageTitle)}
                      placeholder="Pamela Liversidge"
                      autoComplete="off"
                    />
                  </div>
                </div>

                <div className="field">
                  <label htmlFor="findWikitext">Find wikitext</label>
                  <span className="info-hint" title="[https://archive.example.com/20130118233601/http://www.burkespeerage.com/FamilyHomepage.aspx?FID=8529 Burke's Peerage and Gentry]">(example)</span>
                  <textarea
                    id="findWikitext"
                    value={findWikitext}
                    onChange={handleInputChange(setFindWikitext)}
                    onBlur={handleFindBlur}
                    spellCheck="false"
                  />
                </div>

                <div className="field">
                  <label htmlFor="replaceWikitext">Replace wikitext</label>
                  <textarea
                    id="replaceWikitext"
                    value={replaceWikitext}
                    onChange={handleInputChange(setReplaceWikitext)}
                    spellCheck="false"
                  />
                </div>

                <div className="actions">
                  <button className="primary" type="submit" disabled={status === STATUS.loading}>
                    {status === STATUS.loading ? "Searching..." : "Search/Preview"}
                  </button>
                  <button
                    className="secondary"
                    type="button"
                    onClick={handleHandoff}
                    disabled={!canHandOff}
                  >
                    Continue to Wikipedia
                  </button>
                </div>
              </form>

              <div className={statusClass(status)} role="status" aria-live="polite">
                {message}
              </div>
            </section>

            <section className="panel" aria-labelledby="review-title">
              <div className="panel-header">
                <h2 id="review-title">Review</h2>
              </div>

              <div className="review">
                {matchResult ? (
                  <React.Fragment>
                    <div className="metrics" aria-label="Replacement details">
                      <div className="metric">
                        <span>Site</span>
                        <strong>{siteCode}</strong>
                      </div>
                      <div className="metric">
                        <span>Page</span>
                        <strong>{retrievedPageTitle || normalizedPageTitle || "Not set"}</strong>
                      </div>
                      <div className="metric">
                        <span>Matches</span>
                        <strong>{matchResult.count}</strong>
                      </div>
                    </div>

                    <div className="review-block">
                      <h3>Find</h3>
                      <pre>{matchResult.originalSnippet}</pre>
                    </div>

                    <div className="review-block">
                      <h3>Replace</h3>
                      <pre>{matchResult.replacementSnippet || "(remove matched wikitext)"}</pre>
                    </div>

                    {canHandOff ? (
                      <p className="handoff-note">
                        Wikipedia handles authentication, diff review, edit conflicts, and saving after handoff.
                      </p>
                    ) : null}
                  </React.Fragment>
                ) : (
                  <p className="empty-review">No prepared replacement.</p>
                )}
              </div>
            </section>
          </div>
        </main>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
